<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta http-equiv="refresh" content="$refresh">
  <title>$title</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #111821; color: #f4f7fb; font: 18px -apple-system, Arial, sans-serif; }
    .panel { max-width: 1100px; padding: 28px 26px; margin: 0 auto; }
    .clock { font-size: 64px; font-weight: bold; line-height: 1; margin: 0 0 12px; }
    h1 { font-size: 26px; margin: 0 0 8px; overflow-wrap: break-word; word-wrap: break-word; }
    .status { color: #a9d7d5; margin: 0 0 24px; }
    .status.warn { color: #ffd281; }
    ul { list-style: none; margin: 0; padding: 0; font-size: 0; }
    li { display: inline-block; vertical-align: top; width: 31.33%; margin: 0 2% 16px 0; min-height: 128px; padding: 18px; border: 1px solid #34465a; border-radius: 10px; background: #1b2735; word-wrap: break-word; }
    h2 { font-size: 18px; color: #becfe0; margin: 0 0 10px; }
    li p { font-size: 36px; line-height: 1.1; margin: 0; }
    li span { font-size: 19px; color: #becfe0; }
    @media (max-width: 740px) { li { width: 48%; } }
    @media (max-width: 440px) { .panel { padding: 18px; } li { width: 100%; margin-right: 0; } }
  </style>
</head>
<body>
  <main class="panel">
    <p class="clock">$clock</p>
    <h1>$title</h1>
    <p class="status $status_class">$status &middot; Last update: $updated</p>
    <ul>$cards</ul>
  </main>
</body>
</html>
