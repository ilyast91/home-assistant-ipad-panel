name: iPad Panel
version: "0.3.0"
slug: ipad_panel
description: Password-protected Home Assistant panel for old iPads
url: https://github.com/ilyast91/home-assistant-ipad-panel
arch:
  - aarch64
  - amd64
startup: application
boot: manual
stage: experimental
init: true
homeassistant_api: true
ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: "Panel web UI: http://<HAOS IP>:8090 (trusted LAN only)"
webui: http://[HOST]:[PORT:8090]/
options:
  panel_password: ""
  secure_cookie: false
  demo: true
  title: Home Panel
  timezone: UTC
  refresh_seconds: 15
  allowed_hosts: []
  entities: []
schema:
  panel_password: password
  secure_cookie: bool
  demo: bool
  title: str
  timezone: str
  refresh_seconds: int(5,300)
  allowed_hosts:
    - str
  entities:
    - id: str
      label: str?
