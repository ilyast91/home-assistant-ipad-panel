name: iPad Panel
version: "0.1.0"
slug: ipad_panel
description: Read-only Home Assistant dashboard for old iPads
url: https://github.com/ilyast91/home-assistant-ipad-panel
arch:
  - aarch64
  - amd64
startup: application
boot: manual
stage: experimental
init: true
homeassistant_api: true
ports:
  8090/tcp: null
ports_description:
  8090/tcp: Panel HTTP (trusted LAN only)
webui: http://[HOST]:[PORT:8090]/
options:
  demo: true
  title: Home Panel
  timezone: UTC
  refresh_seconds: 15
  allowed_hosts:
    - homeassistant.local
  entities: []
schema:
  demo: bool
  title: str
  timezone: str
  refresh_seconds: int(5,300)
  allowed_hosts:
    - str
  entities:
    - id: str
      label: str?
