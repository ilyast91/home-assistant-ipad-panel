services:
  ipad-panel:
    build: ./ipad_panel
    init: true
    environment:
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      PANEL_PASSWORD: ${PANEL_PASSWORD:-}
    ports:
      - "${PANEL_BIND_IP:-127.0.0.1}:${PANEL_PORT:-8090}:8090"
    volumes:
      - panel-data:/data
      - type: bind
        source: ./panel.json
        target: /config/panel.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  panel-data:
